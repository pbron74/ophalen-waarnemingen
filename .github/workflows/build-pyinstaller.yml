name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Google Chrome
      run: |
        winget install Google.Chrome --accept-source-agreements --accept-package-agreements

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller selenium webdriver-manager pandas openpyxl requests

    - name: Build Windows EXE
      run: |
        pyinstaller AHlauncher.spec

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AHlauncher-Windows
        path: dist/AHlauncher

